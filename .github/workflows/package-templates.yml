name: Package nested templates

on:
  push:
    branches:
      - main
    paths:
      - "cfn/nested-templates/**"
      - "cfn/root.yaml"
      - ".github/workflows/package-templates.yml"
  workflow_dispatch:

concurrency:
  group: package-templates
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

# The role ARN is a secret so the account ID is masked in logs; the rest are
# repository variables. Set them under Settings > Secrets and variables > Actions.
env:
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  TEMPLATES_BUCKET: ${{ vars.TEMPLATES_BUCKET }}

jobs:
  package:
    name: Lint and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository configuration
        run: |
          missing=()
          for name in AWS_ROLE_ARN AWS_REGION TEMPLATES_BUCKET; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets or variables: ${missing[*]}"
            exit 1
          fi

      # W3002 only notes that root.yaml's local TemplateURLs need packaging,
      # which is exactly what the next steps do.
      - name: Lint templates
        run: |
          pip install --quiet cfn-lint
          cfn-lint --ignore-checks W3002 -- cfn/root.yaml cfn/nested-templates/*.yaml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package the root template
        run: |
          mkdir -p cfn/packaged
          aws cloudformation package \
            --template-file cfn/root.yaml \
            --s3-bucket "$TEMPLATES_BUCKET" \
            --s3-prefix templates \
            --output-template-file cfn/packaged/root.yaml

      # Git sync deploys cfn/packaged/root.yaml, so this commit is the deploy.
      - name: Commit the packaged template
        run: |
          git add cfn/packaged/root.yaml
          if git diff --cached --quiet; then
            echo "Packaged template unchanged - nothing to deploy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: package nested templates for ${GITHUB_SHA::7}"
          git push
