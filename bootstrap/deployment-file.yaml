# CloudFormation Git sync deployment file for the bootstrap stack.
#
# The bootstrap stack is normally created once by hand, before Git sync exists
# - see "One-time bootstrap" in the README. This file is here so that later
# changes to it (a new workflow filename, a different image retention) go
# through the same reviewed, versioned path as everything else rather than
# through a console form.
#
# If you do wire this up, give it its own sync configuration pointed at this
# file and a stack name of todo-app-bootstrap, separate from the application
# stack's sync configuration. The two stacks have deliberately different
# lifecycles: this one is close to permanent.

template-file-path: bootstrap/00-bootstrap.yaml

parameters:
  ProjectName: todo-app
  RootStackName: todo-app

  GitHubOwner: 1MuhireDavid
  InfraRepoName: todo-app-infra
  AppRepoName: todo-app
  GitHubBranch: main
  InfraWorkflowFile: package-templates.yml
  AppWorkflowFile: build-and-push.yml

  # The GitHub OIDC provider already exists in account 047719661196, and an
  # account may hold only one per URL. Set this to "true" only in a fresh
  # account that has never federated GitHub Actions.
  CreateOIDCProvider: "false"

  ImagesToRetain: 5
  TemplateRetentionDays: 30

tags:
  Project: todo-app
  Environment: lab
  ManagedBy: cloudformation-git-sync
