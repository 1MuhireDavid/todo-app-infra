AWSTemplateFormatVersion: '2010-09-09'
Description: 'Root stack for the To-Do lab: network, security groups, VPC endpoints,
  RDS with RDS Proxy, ElastiCache Redis, ALB with ECS Fargate, and the blue/green
  delivery pipeline. Nested stacks are split by lifecycle and wired root to nested
  through Outputs and Parameters - no nested stack imports a sibling. Long-lived artifacts
  come from the bootstrap stack through Fn::ImportValue.'
Parameters:
  ProjectName:
    Type: String
    Default: todo-app
    AllowedPattern: ^[a-z][a-z0-9-]{2,30}$
    Description: Name prefix and Project tag value for every resource in every 
      stack.
  BootstrapStackName:
    Type: String
    Default: todo-app-bootstrap
    Description: Name of the bootstrap stack whose exports this stack consumes. 
      Nothing is copy-pasted between the two.
  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
    Description: VPC CIDR.
  PublicSubnet1Cidr:
    Type: String
    Default: 10.40.0.0/24
    Description: Public subnet, AZ A.
  PublicSubnet2Cidr:
    Type: String
    Default: 10.40.1.0/24
    Description: Public subnet, AZ B.
  AppSubnet1Cidr:
    Type: String
    Default: 10.40.10.0/24
    Description: App subnet, AZ A.
  AppSubnet2Cidr:
    Type: String
    Default: 10.40.11.0/24
    Description: App subnet, AZ B.
  DataSubnet1Cidr:
    Type: String
    Default: 10.40.20.0/24
    Description: Data subnet, AZ A.
  DataSubnet2Cidr:
    Type: String
    Default: 10.40.21.0/24
    Description: Data subnet, AZ B.
  CacheSubnet1Cidr:
    Type: String
    Default: 10.40.30.0/24
    Description: Cache subnet, AZ A.
  CacheSubnet2Cidr:
    Type: String
    Default: 10.40.31.0/24
    Description: Cache subnet, AZ B.
  ContainerPort:
    Type: Number
    Default: 8080
    Description: Port the container listens on.
  TestListenerPort:
    Type: Number
    Default: 9000
    Description: ALB test listener port for blue/green validation.
  DatabaseName:
    Type: String
    Default: todoapp
    Description: Initial database name.
  MasterUsername:
    Type: String
    Default: todoadmin
    Description: Master username. The password is generated by RDS, never set 
      here.
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues:
    - db.t3.micro
    - db.t3.small
    - db.t4g.micro
    - db.t4g.small
    Description: RDS instance class.
  DatabaseEngineVersion:
    Type: String
    Default: '16'
    Description: PostgreSQL major version.
  MultiAZ:
    Type: String
    Default: 'false'
    AllowedValues:
    - 'true'
    - 'false'
    Description: RDS Multi-AZ. Off for cost; production runs it on.
  BackupRetentionPeriod:
    Type: Number
    Default: 1
    Description: Days of automated RDS backups.
  CacheNodeType:
    Type: String
    Default: cache.t4g.micro
    AllowedValues:
    - cache.t4g.micro
    - cache.t4g.small
    - cache.t3.micro
    - cache.t3.small
    Description: ElastiCache node type.
  CacheReplicaCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 2
    Description: Replicas behind the primary. 1 buys Multi-AZ failover at double
      the node cost; 0 halves the bill and gives it up.
  CacheTtlSeconds:
    Type: Number
    Default: 60
    Description: TTL on cached reads.
  ImageTag:
    Type: String
    Default: latest
    Description: Tag for the bootstrap task revision and the tag the pipeline 
      watches. An image with this tag must exist in ECR before this stack is 
      created.
  TaskCpu:
    Type: String
    Default: '512'
    AllowedValues:
    - '256'
    - '512'
    - '1024'
    Description: Fargate CPU units.
  TaskMemory:
    Type: String
    Default: '1024'
    AllowedValues:
    - '512'
    - '1024'
    - '2048'
    Description: Fargate memory, MiB.
  DesiredCount:
    Type: Number
    Default: 1
    Description: Starting task count.
  MinCapacity:
    Type: Number
    Default: 1
    Description: Autoscaling floor.
  MaxCapacity:
    Type: Number
    Default: 4
    Description: Autoscaling ceiling.
  CpuTargetValue:
    Type: Number
    Default: 60
    Description: Target average CPU percentage.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
    - 1
    - 3
    - 7
    - 14
    - 30
    - 90
    Description: CloudWatch Logs retention.
  DeploymentConfigName:
    Type: String
    Default: CodeDeployDefault.ECSAllAtOnce
    AllowedValues:
    - CodeDeployDefault.ECSAllAtOnce
    - CodeDeployDefault.ECSLinear10PercentEvery1Minutes
    - CodeDeployDefault.ECSCanary10Percent5Minutes
    Description: CodeDeploy traffic shifting strategy.
Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/todo-app-cfn-templates-047719661196-us-east-1/templates/379f78607c206f05a93e783e9fc1104a.template
      Parameters:
        ProjectName:
          Ref: ProjectName
        VpcCidr:
          Ref: VpcCidr
        PublicSubnet1Cidr:
          Ref: PublicSubnet1Cidr
        PublicSubnet2Cidr:
          Ref: PublicSubnet2Cidr
        AppSubnet1Cidr:
          Ref: AppSubnet1Cidr
        AppSubnet2Cidr:
          Ref: AppSubnet2Cidr
        DataSubnet1Cidr:
          Ref: DataSubnet1Cidr
        DataSubnet2Cidr:
          Ref: DataSubnet2Cidr
        CacheSubnet1Cidr:
          Ref: CacheSubnet1Cidr
        CacheSubnet2Cidr:
          Ref: CacheSubnet2Cidr
      Tags:
      - Key: Project
        Value:
          Ref: ProjectName
  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/todo-app-cfn-templates-047719661196-us-east-1/templates/7895a4e216f9a71ae816d353a8dd9cf5.template
      Parameters:
        ProjectName:
          Ref: ProjectName
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        VpcCidr:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcCidr
        ContainerPort:
          Ref: ContainerPort
      Tags:
      - Key: Project
        Value:
          Ref: ProjectName
  VpcEndpointsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/todo-app-cfn-templates-047719661196-us-east-1/templates/e9b133d43061d04119b9f0229875ec03.template
      Parameters:
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        EndpointSubnetIds:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.EndpointSubnetIds
        PrivateRouteTableIds:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.PrivateRouteTableIds
        VpcEndpointSecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.VpcEndpointSecurityGroupId
      Tags:
      - Key: Project
        Value:
          Ref: ProjectName
  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VpcEndpointsStack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/todo-app-cfn-templates-047719661196-us-east-1/templates/0a4bde34d7deb213f8ad33fc172d8ee8.template
      Parameters:
        ProjectName:
          Ref: ProjectName
        DataSubnetIds:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.DataSubnetIds
        DatabaseSecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.DatabaseSecurityGroupId
        RdsProxySecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.RdsProxySecurityGroupId
        DatabaseName:
          Ref: DatabaseName
        MasterUsername:
          Ref: MasterUsername
        DBInstanceClass:
          Ref: DBInstanceClass
        EngineVersion:
          Ref: DatabaseEngineVersion
        MultiAZ:
          Ref: MultiAZ
        BackupRetentionPeriod:
          Ref: BackupRetentionPeriod
        DatabasePort: 5432
      Tags:
      - Key: Project
        Value:
          Ref: ProjectName
  CacheStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/todo-app-cfn-templates-047719661196-us-east-1/templates/3a20687132712057593dd6616bd73071.template
      Parameters:
        ProjectName:
          Ref: ProjectName
        CacheSubnetIds:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.CacheSubnetIds
        CacheSecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.CacheSecurityGroupId
        CacheNodeType:
          Ref: CacheNodeType
        CacheReplicaCount:
          Ref: CacheReplicaCount
        RedisPort: 6379
      Tags:
      - Key: Project
        Value:
          Ref: ProjectName
  AlbEcsStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VpcEndpointsStack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/todo-app-cfn-templates-047719661196-us-east-1/templates/0507e7424d2df70ceb57ae1e7ff9f6aa.template
      Parameters:
        ProjectName:
          Ref: ProjectName
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        PublicSubnetIds:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.PublicSubnetIds
        AppSubnetIds:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.AppSubnetIds
        AlbSecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.AlbSecurityGroupId
        EcsTaskSecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.EcsTaskSecurityGroupId
        ArtifactBucketName:
          Fn::ImportValue:
            Fn::Sub: ${BootstrapStackName}-ArtifactBucketName
        EcrRepositoryUri:
          Fn::ImportValue:
            Fn::Sub: ${BootstrapStackName}-EcrRepositoryUri
        EcrRepositoryArn:
          Fn::ImportValue:
            Fn::Sub: ${BootstrapStackName}-EcrRepositoryArn
        ImageTag:
          Ref: ImageTag
        ContainerPort:
          Ref: ContainerPort
        TestListenerPort:
          Ref: TestListenerPort
        TaskCpu:
          Ref: TaskCpu
        TaskMemory:
          Ref: TaskMemory
        DesiredCount:
          Ref: DesiredCount
        MinCapacity:
          Ref: MinCapacity
        MaxCapacity:
          Ref: MaxCapacity
        CpuTargetValue:
          Ref: CpuTargetValue
        LogRetentionDays:
          Ref: LogRetentionDays
        DatabaseProxyEndpoint:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.ProxyEndpoint
        DatabasePort:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.DatabasePort
        DatabaseName:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.DatabaseName
        DatabaseSecretArn:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.MasterUserSecretArn
        RedisEndpoint:
          Fn::GetAtt:
          - CacheStack
          - Outputs.PrimaryEndpointAddress
        RedisPort:
          Fn::GetAtt:
          - CacheStack
          - Outputs.PrimaryEndpointPort
        RedisAuthSecretArn:
          Fn::GetAtt:
          - CacheStack
          - Outputs.AuthTokenSecretArn
        CacheTtlSeconds:
          Ref: CacheTtlSeconds
      Tags:
      - Key: Project
        Value:
          Ref: ProjectName
  CicdStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/todo-app-cfn-templates-047719661196-us-east-1/templates/056e8b879cdc33593bc66766907c1bf3.template
      Parameters:
        ProjectName:
          Ref: ProjectName
        ArtifactBucketName:
          Fn::ImportValue:
            Fn::Sub: ${BootstrapStackName}-ArtifactBucketName
        ArtifactBucketArn:
          Fn::ImportValue:
            Fn::Sub: ${BootstrapStackName}-ArtifactBucketArn
        EcrRepositoryName:
          Fn::ImportValue:
            Fn::Sub: ${BootstrapStackName}-EcrRepositoryName
        EcrRepositoryArn:
          Fn::ImportValue:
            Fn::Sub: ${BootstrapStackName}-EcrRepositoryArn
        ImageTag:
          Ref: ImageTag
        ClusterName:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.ClusterName
        ServiceName:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.ServiceName
        TargetGroupBlueName:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.TargetGroupBlueName
        TargetGroupGreenName:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.TargetGroupGreenName
        ProdListenerArn:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.ProdListenerArn
        TestListenerArn:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.TestListenerArn
        EcsExecutionRoleArn:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.ExecutionRoleArn
        EcsTaskRoleArn:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.TaskRoleArn
        ContainerPort:
          Ref: ContainerPort
        TaskCpu:
          Ref: TaskCpu
        TaskMemory:
          Ref: TaskMemory
        LogGroupName:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.LogGroupName
        DatabaseProxyEndpoint:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.ProxyEndpoint
        DatabasePort:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.DatabasePort
        DatabaseName:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.DatabaseName
        DatabaseSecretArn:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.MasterUserSecretArn
        RedisEndpoint:
          Fn::GetAtt:
          - CacheStack
          - Outputs.PrimaryEndpointAddress
        RedisPort:
          Fn::GetAtt:
          - CacheStack
          - Outputs.PrimaryEndpointPort
        RedisAuthSecretArn:
          Fn::GetAtt:
          - CacheStack
          - Outputs.AuthTokenSecretArn
        CacheTtlSeconds:
          Ref: CacheTtlSeconds
        DeploymentConfigName:
          Ref: DeploymentConfigName
      Tags:
      - Key: Project
        Value:
          Ref: ProjectName
Outputs:
  ApplicationUrl:
    Description: Public URL of the To-Do application.
    Value:
      Fn::GetAtt:
      - AlbEcsStack
      - Outputs.ApplicationUrl
  TestListenerUrl:
    Description: Green task set during a deployment, before traffic shifts.
    Value:
      Fn::GetAtt:
      - AlbEcsStack
      - Outputs.TestListenerUrl
  PipelineUrl:
    Description: Console link to the delivery pipeline.
    Value:
      Fn::GetAtt:
      - CicdStack
      - Outputs.PipelineUrl
  ClusterName:
    Description: ECS cluster name.
    Value:
      Fn::GetAtt:
      - AlbEcsStack
      - Outputs.ClusterName
  ServiceName:
    Description: ECS service name.
    Value:
      Fn::GetAtt:
      - AlbEcsStack
      - Outputs.ServiceName
  ContainerName:
    Description: Container name used in appspec.yaml and taskdef.json.
    Value:
      Fn::GetAtt:
      - AlbEcsStack
      - Outputs.ContainerName
  TaskFamily:
    Description: Task definition family the pipeline registers revisions in.
    Value:
      Fn::Sub: ${ProjectName}-task
  ExecutionRoleArn:
    Description: ECS execution role ARN.
    Value:
      Fn::GetAtt:
      - AlbEcsStack
      - Outputs.ExecutionRoleArn
  TaskRoleArn:
    Description: ECS task role ARN.
    Value:
      Fn::GetAtt:
      - AlbEcsStack
      - Outputs.TaskRoleArn
  LogGroupName:
    Description: CloudWatch log group for the tasks.
    Value:
      Fn::GetAtt:
      - AlbEcsStack
      - Outputs.LogGroupName
  DatabaseProxyEndpoint:
    Description: RDS Proxy endpoint the application connects to.
    Value:
      Fn::GetAtt:
      - DatabaseStack
      - Outputs.ProxyEndpoint
  DatabasePort:
    Description: PostgreSQL port.
    Value:
      Fn::GetAtt:
      - DatabaseStack
      - Outputs.DatabasePort
  DatabaseName:
    Description: Database name.
    Value:
      Fn::GetAtt:
      - DatabaseStack
      - Outputs.DatabaseName
  DatabaseSecretArn:
    Description: RDS-managed master secret ARN.
    Value:
      Fn::GetAtt:
      - DatabaseStack
      - Outputs.MasterUserSecretArn
  RedisEndpoint:
    Description: ElastiCache primary endpoint.
    Value:
      Fn::GetAtt:
      - CacheStack
      - Outputs.PrimaryEndpointAddress
  RedisPort:
    Description: Redis port.
    Value:
      Fn::GetAtt:
      - CacheStack
      - Outputs.PrimaryEndpointPort
  RedisAuthSecretArn:
    Description: Redis AUTH token secret ARN.
    Value:
      Fn::GetAtt:
      - CacheStack
      - Outputs.AuthTokenSecretArn
