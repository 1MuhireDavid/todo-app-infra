AWSTemplateFormatVersion: '2010-09-09'
Description: 'Root stack for the To-Do lab: network, security groups, VPC endpoints,
  RDS with RDS Proxy, ElastiCache Redis, ALB with ECS Fargate, and the blue/green
  delivery pipeline. Nested stacks are split by lifecycle and wired root to nested
  through Outputs and Parameters - no nested stack imports a sibling. Long-lived artifacts
  come from the bootstrap stack through Fn::ImportValue.'
Parameters:
  ProjectName:
    Type: String
    Default: todo-app
    AllowedPattern: ^[a-z][a-z0-9-]{2,30}$
    Description: Name prefix and Project tag value for every resource in every 
      stack.
  BootstrapStackName:
    Type: String
    Default: todo-app-bootstrap
    Description: Name of the bootstrap stack whose exports this stack consumes. 
      Nothing is copy-pasted between the two.
  DatabaseEngineVersion:
    Type: String
    Default: '16'
    Description: PostgreSQL major version.
  ContainerPort:
    Type: Number
    Default: 8080
    Description: Port the container listens on.
  CacheTtlSeconds:
    Type: Number
    Default: 60
    Description: TTL on cached reads.
  ImageTag:
    Type: String
    Default: latest
    Description: Tag for the bootstrap task revision and the tag the pipeline 
      watches. An image with this tag must exist in ECR before this stack is 
      created.
  TaskCpu:
    Type: String
    Default: '512'
    AllowedValues:
    - '256'
    - '512'
    - '1024'
    Description: Fargate CPU units.
  TaskMemory:
    Type: String
    Default: '1024'
    AllowedValues:
    - '512'
    - '1024'
    - '2048'
    Description: Fargate memory, MiB.
Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/todo-app-cfn-templates-047719661196-us-east-1/templates/b7c84ff4b2e0f30efc9e0c70e9b629d9.template
      Parameters:
        ProjectName:
          Ref: ProjectName
      Tags:
      - Key: Project
        Value:
          Ref: ProjectName
  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/todo-app-cfn-templates-047719661196-us-east-1/templates/349d02253166e2785d4ffb94d4afdde7.template
      Parameters:
        ProjectName:
          Ref: ProjectName
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        VpcCidr:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcCidr
        ContainerPort:
          Ref: ContainerPort
      Tags:
      - Key: Project
        Value:
          Ref: ProjectName
  VpcEndpointsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/todo-app-cfn-templates-047719661196-us-east-1/templates/e9b133d43061d04119b9f0229875ec03.template
      Parameters:
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        EndpointSubnetIds:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.EndpointSubnetIds
        PrivateRouteTableIds:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.PrivateRouteTableIds
        VpcEndpointSecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.VpcEndpointSecurityGroupId
      Tags:
      - Key: Project
        Value:
          Ref: ProjectName
  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VpcEndpointsStack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/todo-app-cfn-templates-047719661196-us-east-1/templates/4ff5cbf3244d669acaf5fc426858838d.template
      Parameters:
        ProjectName:
          Ref: ProjectName
        DataSubnetIds:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.DataSubnetIds
        DatabaseSecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.DatabaseSecurityGroupId
        RdsProxySecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.RdsProxySecurityGroupId
        DatabasePort: 5432
        EngineVersion:
          Ref: DatabaseEngineVersion
      Tags:
      - Key: Project
        Value:
          Ref: ProjectName
  CacheStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/todo-app-cfn-templates-047719661196-us-east-1/templates/b20ecedde0b5eda6b66439273dd59717.template
      Parameters:
        ProjectName:
          Ref: ProjectName
        CacheSubnetIds:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.CacheSubnetIds
        CacheSecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.CacheSecurityGroupId
        RedisPort: 6379
      Tags:
      - Key: Project
        Value:
          Ref: ProjectName
  AlbEcsStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VpcEndpointsStack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/todo-app-cfn-templates-047719661196-us-east-1/templates/638fb594bdfdfebe8161e8ec5a8aacf9.template
      Parameters:
        ProjectName:
          Ref: ProjectName
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        PublicSubnetIds:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.PublicSubnetIds
        AppSubnetIds:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.AppSubnetIds
        AlbSecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.AlbSecurityGroupId
        EcsTaskSecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.EcsTaskSecurityGroupId
        ArtifactBucketName:
          Fn::ImportValue:
            Fn::Sub: ${BootstrapStackName}-ArtifactBucketName
        EcrRepositoryUri:
          Fn::ImportValue:
            Fn::Sub: ${BootstrapStackName}-EcrRepositoryUri
        EcrRepositoryArn:
          Fn::ImportValue:
            Fn::Sub: ${BootstrapStackName}-EcrRepositoryArn
        ImageTag:
          Ref: ImageTag
        ContainerPort:
          Ref: ContainerPort
        TaskCpu:
          Ref: TaskCpu
        TaskMemory:
          Ref: TaskMemory
        DatabaseProxyEndpoint:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.ProxyEndpoint
        DatabasePort:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.DatabasePort
        DatabaseName:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.DatabaseName
        DatabaseSecretArn:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.MasterUserSecretArn
        RedisEndpoint:
          Fn::GetAtt:
          - CacheStack
          - Outputs.PrimaryEndpointAddress
        RedisPort:
          Fn::GetAtt:
          - CacheStack
          - Outputs.PrimaryEndpointPort
        RedisAuthSecretArn:
          Fn::GetAtt:
          - CacheStack
          - Outputs.AuthTokenSecretArn
        CacheTtlSeconds:
          Ref: CacheTtlSeconds
      Tags:
      - Key: Project
        Value:
          Ref: ProjectName
  CicdStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/todo-app-cfn-templates-047719661196-us-east-1/templates/869292e93080ea31a4ebb6f9e81cfa34.template
      Parameters:
        ProjectName:
          Ref: ProjectName
        ArtifactBucketName:
          Fn::ImportValue:
            Fn::Sub: ${BootstrapStackName}-ArtifactBucketName
        ArtifactBucketArn:
          Fn::ImportValue:
            Fn::Sub: ${BootstrapStackName}-ArtifactBucketArn
        EcrRepositoryName:
          Fn::ImportValue:
            Fn::Sub: ${BootstrapStackName}-EcrRepositoryName
        EcrRepositoryArn:
          Fn::ImportValue:
            Fn::Sub: ${BootstrapStackName}-EcrRepositoryArn
        ImageTag:
          Ref: ImageTag
        ClusterName:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.ClusterName
        ServiceName:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.ServiceName
        TargetGroupBlueName:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.TargetGroupBlueName
        TargetGroupGreenName:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.TargetGroupGreenName
        ProdListenerArn:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.ProdListenerArn
        TestListenerArn:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.TestListenerArn
        EcsExecutionRoleArn:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.ExecutionRoleArn
        EcsTaskRoleArn:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.TaskRoleArn
        ContainerPort:
          Ref: ContainerPort
        TaskCpu:
          Ref: TaskCpu
        TaskMemory:
          Ref: TaskMemory
        LogGroupName:
          Fn::GetAtt:
          - AlbEcsStack
          - Outputs.LogGroupName
        DatabaseProxyEndpoint:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.ProxyEndpoint
        DatabasePort:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.DatabasePort
        DatabaseName:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.DatabaseName
        DatabaseSecretArn:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.MasterUserSecretArn
        RedisEndpoint:
          Fn::GetAtt:
          - CacheStack
          - Outputs.PrimaryEndpointAddress
        RedisPort:
          Fn::GetAtt:
          - CacheStack
          - Outputs.PrimaryEndpointPort
        RedisAuthSecretArn:
          Fn::GetAtt:
          - CacheStack
          - Outputs.AuthTokenSecretArn
        CacheTtlSeconds:
          Ref: CacheTtlSeconds
      Tags:
      - Key: Project
        Value:
          Ref: ProjectName
Outputs:
  ApplicationUrl:
    Description: Public URL of the To-Do application.
    Value:
      Fn::GetAtt:
      - AlbEcsStack
      - Outputs.ApplicationUrl
  TestListenerUrl:
    Description: Green task set during a deployment, before traffic shifts.
    Value:
      Fn::GetAtt:
      - AlbEcsStack
      - Outputs.TestListenerUrl
  PipelineUrl:
    Description: Console link to the delivery pipeline.
    Value:
      Fn::GetAtt:
      - CicdStack
      - Outputs.PipelineUrl
  ClusterName:
    Description: ECS cluster name.
    Value:
      Fn::GetAtt:
      - AlbEcsStack
      - Outputs.ClusterName
  ServiceName:
    Description: ECS service name.
    Value:
      Fn::GetAtt:
      - AlbEcsStack
      - Outputs.ServiceName
  ContainerName:
    Description: Container name used in appspec.yaml and taskdef.json.
    Value:
      Fn::GetAtt:
      - AlbEcsStack
      - Outputs.ContainerName
  TaskFamily:
    Description: Task definition family the pipeline registers revisions in.
    Value:
      Fn::Sub: ${ProjectName}-task
  ExecutionRoleArn:
    Description: ECS execution role ARN.
    Value:
      Fn::GetAtt:
      - AlbEcsStack
      - Outputs.ExecutionRoleArn
  TaskRoleArn:
    Description: ECS task role ARN.
    Value:
      Fn::GetAtt:
      - AlbEcsStack
      - Outputs.TaskRoleArn
  LogGroupName:
    Description: CloudWatch log group for the tasks.
    Value:
      Fn::GetAtt:
      - AlbEcsStack
      - Outputs.LogGroupName
  DatabaseProxyEndpoint:
    Description: RDS Proxy endpoint the application connects to.
    Value:
      Fn::GetAtt:
      - DatabaseStack
      - Outputs.ProxyEndpoint
  DatabasePort:
    Description: PostgreSQL port.
    Value:
      Fn::GetAtt:
      - DatabaseStack
      - Outputs.DatabasePort
  DatabaseName:
    Description: Database name.
    Value:
      Fn::GetAtt:
      - DatabaseStack
      - Outputs.DatabaseName
  DatabaseSecretArn:
    Description: RDS-managed master secret ARN.
    Value:
      Fn::GetAtt:
      - DatabaseStack
      - Outputs.MasterUserSecretArn
  RedisEndpoint:
    Description: ElastiCache primary endpoint.
    Value:
      Fn::GetAtt:
      - CacheStack
      - Outputs.PrimaryEndpointAddress
  RedisPort:
    Description: Redis port.
    Value:
      Fn::GetAtt:
      - CacheStack
      - Outputs.PrimaryEndpointPort
  RedisAuthSecretArn:
    Description: Redis AUTH token secret ARN.
    Value:
      Fn::GetAtt:
      - CacheStack
      - Outputs.AuthTokenSecretArn
