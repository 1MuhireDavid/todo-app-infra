AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  One security group per resource type. Only ingress is declared. Rules name a
  source security group, except the public HTTP listener and the VPC endpoints,
  which accept HTTPS from the whole VPC. Security groups are stateful, so
  replies to allowed inbound traffic need no egress rule.

Parameters:

  ProjectName:
    Type: String
    Description: Name prefix and Project tag value for every resource.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that owns every group here.

  VpcCidr:
    Type: String
    Description: VPC CIDR block, allowed to reach the interface endpoints.

  ContainerPort:
    Type: Number
    Default: 8080
    MinValue: 1
    MaxValue: 65535
    Description: Port the Spring Boot container listens on.

  DatabasePort:
    Type: Number
    Default: 5432
    Description: PostgreSQL port, on both the proxy and the instance.

  RedisPort:
    Type: Number
    Default: 6379
    Description: Redis port.

Resources:

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-sg-vpce"
      GroupDescription: Interface VPC endpoints - ECR, logs, STS, Secrets Manager.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-sg-vpce"
        - Key: Project
          Value: !Ref ProjectName

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-sg-rds"
      GroupDescription: RDS PostgreSQL instance - reachable from the RDS Proxy only.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-sg-rds"
        - Key: Project
          Value: !Ref ProjectName

  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-sg-cache"
      GroupDescription: ElastiCache Redis nodes - reachable from the ECS tasks only.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-sg-cache"
        - Key: Project
          Value: !Ref ProjectName

  RdsProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-sg-rdsproxy"
      GroupDescription: RDS Proxy ENIs - reachable from the ECS tasks only.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-sg-rdsproxy"
        - Key: Project
          Value: !Ref ProjectName

  EcsTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-sg-ecs"
      GroupDescription: Fargate tasks - reachable from the ALB only.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-sg-ecs"
        - Key: Project
          Value: !Ref ProjectName

  # The test listener has no ingress rule on purpose: the green task set is
  # checked by the ALB health check, never exposed to the internet.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-sg-alb"
      GroupDescription: Public ALB - HTTP from the internet on the production listener only.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
          Description: Production listener.
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-sg-alb"
        - Key: Project
          Value: !Ref ProjectName

  EcsIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsTaskSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref ContainerPort
      ToPort: !Ref ContainerPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: Container port from the ALB only.

  RdsProxyIngressFromEcs:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsProxySecurityGroup
      IpProtocol: tcp
      FromPort: !Ref DatabasePort
      ToPort: !Ref DatabasePort
      SourceSecurityGroupId: !Ref EcsTaskSecurityGroup
      Description: PostgreSQL from the ECS tasks.

  # Not from the task group, so the application cannot bypass the proxy.
  DatabaseIngressFromRdsProxy:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref DatabasePort
      ToPort: !Ref DatabasePort
      SourceSecurityGroupId: !Ref RdsProxySecurityGroup
      Description: PostgreSQL from the RDS Proxy only.

  CacheIngressFromEcs:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CacheSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref RedisPort
      ToPort: !Ref RedisPort
      SourceSecurityGroupId: !Ref EcsTaskSecurityGroup
      Description: Redis from the ECS tasks.

  CacheIngressFromSelf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CacheSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref RedisPort
      ToPort: !Ref RedisPort
      SourceSecurityGroupId: !Ref CacheSecurityGroup
      Description: Replication between the primary and the replica.

  # Covers every client in the VPC, including the RDS Proxy reading its secret
  # through the Secrets Manager endpoint.
  VpcEndpointIngressFromVpc:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref VpcEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref VpcCidr
      Description: HTTPS from anything in the VPC to the interface endpoints.

Outputs:

  AlbSecurityGroupId:
    Description: ALB security group.
    Value: !Ref AlbSecurityGroup

  EcsTaskSecurityGroupId:
    Description: ECS task security group.
    Value: !Ref EcsTaskSecurityGroup

  RdsProxySecurityGroupId:
    Description: RDS Proxy security group.
    Value: !Ref RdsProxySecurityGroup

  DatabaseSecurityGroupId:
    Description: RDS instance security group.
    Value: !Ref DatabaseSecurityGroup

  CacheSecurityGroupId:
    Description: ElastiCache security group.
    Value: !Ref CacheSecurityGroup

  VpcEndpointSecurityGroupId:
    Description: Interface VPC endpoint security group.
    Value: !Ref VpcEndpointSecurityGroup
