AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Data tier: a PostgreSQL instance in the data subnets and an RDS Proxy in
  front of it. The instance password is generated and rotated by RDS into
  Secrets Manager - it is never a parameter, never an output value, and never
  appears in this repository. The application is only ever given the proxy
  endpoint; the instance security group does not admit the task security group
  at all.

Parameters:

  ProjectName:
    Type: String
    Description: Name prefix and Project tag value for every resource.

  DataSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: The two data-tier private subnets. Nothing else belongs in them.

  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for the instance - admits the proxy only.

  RdsProxySecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for the proxy ENIs.

  DatabaseName:
    Type: String
    Default: todoapp
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,62}$"
    Description: Initial database created on the instance.

  MasterUsername:
    Type: String
    Default: todoadmin
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{2,30}$"
    Description: >-
      Master username. The matching password is generated by RDS itself, so
      this is the only half of the credential that is ever written down.

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t4g.micro
      - db.t4g.small
    Description: >-
      db.t3.micro for the lab. Note that db.t4g classes are cheaper but the
      free tier only covers t3.micro, which is why it is the default.

  EngineVersion:
    Type: String
    Default: "16"
    Description: >-
      Major version only, so RDS selects the current minor release and the
      template does not rot when a minor version is deprecated. Pin the full
      version in production, where an unplanned minor upgrade is a change you
      want to schedule.

  AllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
    Description: Storage in GiB. 20 is the gp3 minimum for PostgreSQL.

  MultiAZ:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Off by default for cost - Multi-AZ roughly doubles the instance bill.
      Production runs "true"; see the out-of-scope section of the README.

  BackupRetentionPeriod:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 35
    Description: >-
      One day of automated backups. Deliberately minimal; point-in-time
      recovery beyond a day is out of scope for the lab.

  IdleClientTimeout:
    Type: Number
    Default: 1800
    MinValue: 60
    MaxValue: 28800
    Description: >-
      Seconds the proxy keeps an idle client connection before closing it.
      30 minutes comfortably outlives a HikariCP idle connection so the pool is
      never handed a socket the proxy has already dropped.

  DatabasePort:
    Type: Number
    Default: 5432
    Description: PostgreSQL port.

Resources:

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub "${ProjectName}-db-subnets"
      DBSubnetGroupDescription: Data-tier subnets only - no app or cache subnets.
      SubnetIds: !Ref DataSubnetIds
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db-subnets"
        - Key: Project
          Value: !Ref ProjectName

  DbInstance:
    Type: AWS::RDS::DBInstance
    # CloudFormation defaults RDS instances to Snapshot, which leaves a charged
    # snapshot behind after every teardown and makes a re-create fail on the
    # identifier. Delete is the right lab behaviour; production keeps Snapshot.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      DBName: !Ref DatabaseName
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref AllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      # RDS generates the master password, stores it in Secrets Manager under
      # its own managed secret, and owns rotation. No password value exists in
      # this template, in the deployment file, or in any parameter.
      ManageMasterUserPassword: true
      MasterUsername: !Ref MasterUsername
      MultiAZ: !Ref MultiAZ
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroupId
      Port: !Ref DatabasePort
      BackupRetentionPeriod: !Ref BackupRetentionPeriod
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      # Off for cost; both are worth enabling in production.
      EnablePerformanceInsights: false
      MonitoringInterval: 0
      # False so the lab can actually be torn down. Production sets this true.
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db"
        - Key: Project
          Value: !Ref ProjectName

  # ---------------------------------------------------------------------------
  # The proxy authenticates to PostgreSQL with the RDS-managed secret, using a
  # role scoped to that one secret ARN. Nothing else in the account is granted
  # access to it - in particular the ECS task role is not.
  # ---------------------------------------------------------------------------
  RdsProxyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-rds-proxy-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: read-master-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadManagedMasterSecret
                Effect: Allow
                Action:
                  - "secretsmanager:GetSecretValue"
                  - "secretsmanager:DescribeSecret"
                Resource: !GetAtt DbInstance.MasterUserSecret.SecretArn
              - Sid: DecryptViaSecretsManager
                Effect: Allow
                Action:
                  - "kms:Decrypt"
                # Resource "*" with a ViaService condition: the secret is
                # encrypted with the AWS-managed aws/secretsmanager key, whose
                # ARN is account-specific and not resolvable at template time.
                # The condition is what constrains this - the role can only use
                # a key through the Secrets Manager API in this region.
                Resource: "*"
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  RdsProxy:
    Type: AWS::RDS::DBProxy
    Properties:
      DBProxyName: !Sub "${ProjectName}-proxy"
      EngineFamily: POSTGRESQL
      # TLS between the client and the proxy is mandatory, which is why the
      # application JDBC URL carries sslmode=require.
      RequireTLS: true
      # Debug logging writes full SQL statements to CloudWatch. Off, always.
      DebugLogging: false
      IdleClientTimeout: !Ref IdleClientTimeout
      RoleArn: !GetAtt RdsProxyRole.Arn
      Auth:
        - AuthScheme: SECRETS
          SecretArn: !GetAtt DbInstance.MasterUserSecret.SecretArn
          # SCRAM rather than MD5: PostgreSQL 14 and later default to
          # scram-sha-256 and reject the MD5 handshake.
          ClientPasswordAuthType: POSTGRES_SCRAM_SHA_256
          IAMAuth: DISABLED
      VpcSubnetIds: !Ref DataSubnetIds
      VpcSecurityGroupIds:
        - !Ref RdsProxySecurityGroupId
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  RdsProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    Properties:
      DBProxyName: !Ref RdsProxy
      # "default" is the only name the API accepts for a proxy target group.
      TargetGroupName: default
      DBInstanceIdentifiers:
        - !Ref DbInstance
      ConnectionPoolConfigurationInfo:
        # A db.t3.micro caps out around 112 connections, so the proxy is allowed
        # the full budget and holds half of it idle for reuse - which is the
        # whole point of putting a proxy in front of a small instance that a
        # scaling Fargate service connects to.
        MaxConnectionsPercent: 100
        MaxIdleConnectionsPercent: 50
        ConnectionBorrowTimeout: 120

Outputs:

  ProxyEndpoint:
    Description: >-
      The endpoint the application connects to. The instance endpoint is not
      reachable from the app tier by design.
    Value: !GetAtt RdsProxy.Endpoint

  ProxyName:
    Description: RDS Proxy name.
    Value: !Ref RdsProxy

  InstanceEndpoint:
    Description: >-
      Instance endpoint, for documentation and break-glass access from the data
      tier only. The application must not use this.
    Value: !GetAtt DbInstance.Endpoint.Address

  DatabasePort:
    Description: PostgreSQL port, on both the proxy and the instance.
    Value: !GetAtt DbInstance.Endpoint.Port

  DatabaseName:
    Description: Initial database name.
    Value: !Ref DatabaseName

  MasterUserSecretArn:
    Description: >-
      ARN of the RDS-managed master secret. Passed on to the ECS execution role,
      which injects the username and password into the container as secrets.
      The value itself never leaves Secrets Manager.
    Value: !GetAtt DbInstance.MasterUserSecret.SecretArn
