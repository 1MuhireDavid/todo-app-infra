AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Delivery tier: CodeDeploy blue/green application and deployment group, the
  CodePipeline that renders the task definition and drives it, and the
  EventBridge rule that starts the pipeline on an ECR push.

  The artifact bucket is not created here - it belongs to the bootstrap stack,
  because the ALB in 06 needs it for access logs and this stack has to be
  created after 06.

Parameters:

  ProjectName:
    Type: String
    Description: Name prefix and Project tag value for every resource.

  ArtifactBucketName:
    Type: String
    Description: Pipeline artifact bucket, from the bootstrap stack.

  ArtifactBucketArn:
    Type: String
    Description: Pipeline artifact bucket ARN, for scoping the pipeline role.

  EcrRepositoryName:
    Type: String
    Description: ECR repository the image source action watches.

  EcrRepositoryArn:
    Type: String
    Description: ECR repository ARN, for scoping the pipeline role.

  ImageTag:
    Type: String
    Default: latest
    Description: The tag the build pushes and the pipeline deploys.

  ClusterName:
    Type: String
    Description: ECS cluster hosting the service.

  ServiceName:
    Type: String
    Description: ECS service CodeDeploy deploys to.

  TargetGroupBlueName:
    Type: String
    Description: Blue target group name.

  TargetGroupGreenName:
    Type: String
    Description: Green target group name.

  ProdListenerArn:
    Type: String
    Description: Production listener, shifted on cutover.

  TestListenerArn:
    Type: String
    Description: Test listener, pointed at the new task set before cutover.

  EcsExecutionRoleArn:
    Type: String
    Description: Execution role the pipeline passes when registering a task definition.

  EcsTaskRoleArn:
    Type: String
    Description: Task role the pipeline passes when registering a task definition.

  ContainerPort:
    Type: Number
    Description: Port the application container listens on.

  HealthCheckPath:
    Type: String
    Default: /health
    Description: Path the container health check requests, same as the ALB check.

  TaskCpu:
    Type: String
    Description: Fargate task CPU units.

  TaskMemory:
    Type: String
    Description: Fargate task memory in MiB.

  LogGroupName:
    Type: String
    Description: CloudWatch log group the tasks write to.

  DatabaseProxyEndpoint:
    Type: String
    Description: RDS Proxy endpoint the application connects to.

  DatabasePort:
    Type: String
    Description: PostgreSQL port.

  DatabaseName:
    Type: String
    Description: Application database name.

  DatabaseSecretArn:
    Type: String
    Description: Secret holding the database username and password.

  RedisEndpoint:
    Type: String
    Description: ElastiCache primary endpoint.

  RedisPort:
    Type: String
    Description: Redis port.

  RedisAuthSecretArn:
    Type: String
    Description: Secret holding the Redis AUTH token.

  CacheTtlSeconds:
    Type: Number
    Description: Read cache TTL passed to the application.

Resources:

  # ---------------------------------------------------------------------------
  # CodeDeploy
  # ---------------------------------------------------------------------------
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codedeploy-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        # AWS-managed and ECS-specific. Writing this by hand means tracking
        # every ELB and ECS call CodeDeploy makes during a traffic shift, which
        # is a maintenance burden with no security gain over the scoped managed
        # policy.
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSCodeDeployRoleForECS"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub "${ProjectName}-app"
      ComputePlatform: ECS

  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub "${ProjectName}-dg"
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 3
      ECSServices:
        - ClusterName: !Ref ClusterName
          ServiceName: !Ref ServiceName
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: !Ref TargetGroupBlueName
              - Name: !Ref TargetGroupGreenName
            ProdTrafficRoute:
              ListenerArns:
                - !Ref ProdListenerArn
            TestTrafficRoute:
              ListenerArns:
                - !Ref TestListenerArn
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
          - DEPLOYMENT_STOP_ON_REQUEST

  # ---------------------------------------------------------------------------
  # Pipeline
  # ---------------------------------------------------------------------------
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-pipeline-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: run-blue-green-deploys
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ArtifactBucketObjects
                Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:GetObjectVersion"
                  - "s3:PutObject"
                Resource: !Sub "${ArtifactBucketArn}/*"
              - Sid: ArtifactBucketMetadata
                Effect: Allow
                Action:
                  - "s3:GetBucketVersioning"
                  - "s3:ListBucket"
                Resource: !Ref ArtifactBucketArn
              - Sid: ReadSourceImage
                Effect: Allow
                Action:
                  - "ecr:DescribeImages"
                  - "ecr:BatchGetImage"
                Resource: !Ref EcrRepositoryArn
              - Sid: DriveCodeDeploy
                Effect: Allow
                Action:
                  - "codedeploy:CreateDeployment"
                  - "codedeploy:GetDeployment"
                  - "codedeploy:GetApplication"
                  - "codedeploy:GetApplicationRevision"
                  - "codedeploy:RegisterApplicationRevision"
                  - "codedeploy:GetDeploymentGroup"
                Resource:
                  - !Sub "arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${CodeDeployApplication}"
                  - !Sub "arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${CodeDeployApplication}/${ProjectName}-dg"
              - Sid: ReadDeploymentConfigs
                Effect: Allow
                Action:
                  - "codedeploy:GetDeploymentConfig"
                # Deployment configurations are AWS-owned resources named
                # CodeDeployDefault.*; the ARN is predictable but the action is
                # read-only metadata, so the wildcard is on the config name
                # only, not on the service.
                Resource: !Sub "arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*"
              - Sid: RegisterTaskDefinition
                Effect: Allow
                Action:
                  - "ecs:RegisterTaskDefinition"
                # Resource "*" is required: RegisterTaskDefinition creates a
                # resource that does not exist yet, so there is no ARN to scope
                # it to. IAM offers no condition key for the family either.
                Resource: "*"
              - Sid: InspectService
                Effect: Allow
                Action:
                  - "ecs:DescribeServices"
                  - "ecs:DescribeTaskDefinition"
                Resource: "*"
                Condition:
                  # DescribeTaskDefinition takes no resource ARN, so the pair is
                  # constrained by cluster instead - the pipeline can only look
                  # at this project's cluster.
                  ArnEqualsIfExists:
                    "ecs:cluster": !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}"
              - Sid: RunRenderBuild
                Effect: Allow
                Action:
                  - "codebuild:StartBuild"
                  - "codebuild:BatchGetBuilds"
                Resource: !GetAtt RenderProject.Arn
              - Sid: PassEcsRoles
                Effect: Allow
                Action:
                  - "iam:PassRole"
                Resource:
                  - !Ref EcsExecutionRoleArn
                  - !Ref EcsTaskRoleArn
                Condition:
                  # Narrows the grant to task registration: these roles cannot
                  # be handed to EC2, Lambda or anything else.
                  StringEqualsIfExists:
                    "iam:PassedToService": ecs-tasks.amazonaws.com
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  RenderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-render-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: render-deploy-bundle
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BuildLogs
                Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-render:*"
              - Sid: PipelineArtifacts
                Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:GetObjectVersion"
                  - "s3:PutObject"
                Resource: !Sub "${ArtifactBucketArn}/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Rendered here rather than copied from 06: CloudFormation cannot update a
  # CODE_DEPLOY service, so this buildspec is the live container shape.
  RenderProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectName}-render"
      ServiceRole: !GetAtt RenderRole.Arn
      TimeoutInMinutes: 5
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - |
                  jq -n '{
                    family: env.TASK_FAMILY,
                    networkMode: "awsvpc",
                    requiresCompatibilities: ["FARGATE"],
                    cpu: env.TASK_CPU,
                    memory: env.TASK_MEMORY,
                    executionRoleArn: env.EXECUTION_ROLE_ARN,
                    taskRoleArn: env.TASK_ROLE_ARN,
                    runtimePlatform: {cpuArchitecture: "X86_64", operatingSystemFamily: "LINUX"},
                    containerDefinitions: [{
                      name: env.CONTAINER_NAME,
                      image: "<IMAGE1_NAME>",
                      essential: true,
                      portMappings: [{containerPort: (env.CONTAINER_PORT | tonumber), protocol: "tcp"}],
                      healthCheck: {
                        command: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:\(env.CONTAINER_PORT)\(env.HEALTH_CHECK_PATH) || exit 1"],
                        interval: 30,
                        timeout: 5,
                        retries: 3,
                        startPeriod: 60
                      },
                      environment: [
                        {name: "SERVER_PORT", value: env.CONTAINER_PORT},
                        {name: "DB_HOST", value: env.DB_HOST},
                        {name: "DB_PORT", value: env.DB_PORT},
                        {name: "DB_NAME", value: env.DB_NAME},
                        {name: "REDIS_HOST", value: env.REDIS_HOST},
                        {name: "REDIS_PORT", value: env.REDIS_PORT},
                        {name: "CACHE_TTL_SECONDS", value: env.CACHE_TTL_SECONDS}
                      ],
                      secrets: [
                        {name: "DB_USERNAME", valueFrom: "\(env.DB_SECRET_ARN):username::"},
                        {name: "DB_PASSWORD", valueFrom: "\(env.DB_SECRET_ARN):password::"},
                        {name: "REDIS_AUTH_TOKEN", valueFrom: "\(env.REDIS_SECRET_ARN):authToken::"}
                      ],
                      logConfiguration: {
                        logDriver: "awslogs",
                        options: {
                          "awslogs-group": env.LOG_GROUP,
                          "awslogs-region": env.AWS_REGION,
                          "awslogs-stream-prefix": "app"
                        }
                      }
                    }]
                  }' > taskdef.json
                - |
                  cat > appspec.yaml <<EOF
                  version: 0.0
                  Resources:
                    - TargetService:
                        Type: AWS::ECS::Service
                        Properties:
                          TaskDefinition: <TASK_DEFINITION>
                          LoadBalancerInfo:
                            ContainerName: ${CONTAINER_NAME}
                            ContainerPort: ${CONTAINER_PORT}
                          PlatformVersion: LATEST
                  EOF
                - cat taskdef.json appspec.yaml
          artifacts:
            files:
              - taskdef.json
              - appspec.yaml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: TASK_FAMILY
            Value: !Sub "${ProjectName}-task"
          - Name: CONTAINER_NAME
            Value: !Ref ProjectName
          - Name: CONTAINER_PORT
            Value: !Ref ContainerPort
          - Name: HEALTH_CHECK_PATH
            Value: !Ref HealthCheckPath
          - Name: TASK_CPU
            Value: !Ref TaskCpu
          - Name: TASK_MEMORY
            Value: !Ref TaskMemory
          - Name: EXECUTION_ROLE_ARN
            Value: !Ref EcsExecutionRoleArn
          - Name: TASK_ROLE_ARN
            Value: !Ref EcsTaskRoleArn
          - Name: LOG_GROUP
            Value: !Ref LogGroupName
          - Name: DB_HOST
            Value: !Ref DatabaseProxyEndpoint
          - Name: DB_PORT
            Value: !Ref DatabasePort
          - Name: DB_NAME
            Value: !Ref DatabaseName
          - Name: DB_SECRET_ARN
            Value: !Ref DatabaseSecretArn
          - Name: REDIS_HOST
            Value: !Ref RedisEndpoint
          - Name: REDIS_PORT
            Value: !Ref RedisPort
          - Name: REDIS_SECRET_ARN
            Value: !Ref RedisAuthSecretArn
          - Name: CACHE_TTL_SECONDS
            Value: !Ref CacheTtlSeconds
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${ProjectName}-pipeline"
      # V1 billing is a flat monthly charge per active pipeline; V2 bills per
      # action-minute and adds features this lab does not use.
      PipelineType: V1
      RoleArn: !GetAtt PipelineRole.Arn
      RestartExecutionOnUpdate: false
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucketName
      Stages:
        - Name: Source
          Actions:
            - Name: ContainerImage
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: ECR
                Version: "1"
              Configuration:
                RepositoryName: !Ref EcrRepositoryName
                ImageTag: !Ref ImageTag
              OutputArtifacts:
                - Name: ImageArtifact
              RunOrder: 1
        - Name: Render
          Actions:
            - Name: TaskDefinition
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref RenderProject
              InputArtifacts:
                - Name: ImageArtifact
              OutputArtifacts:
                - Name: DeployBundleArtifact
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: BlueGreenDeploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: "1"
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref DeploymentGroup
                TaskDefinitionTemplateArtifact: DeployBundleArtifact
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: DeployBundleArtifact
                AppSpecTemplatePath: appspec.yaml
                Image1ArtifactName: ImageArtifact
                # The placeholder string inside taskdef.json, not a container
                # name: CodePipeline replaces <IMAGE1_NAME> with the image URI
                # carried in the ECR source artifact.
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: DeployBundleArtifact
                - Name: ImageArtifact
              RunOrder: 1
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ---------------------------------------------------------------------------
  # The single trigger: a successful push of the deployed tag to this one
  # repository.
  # ---------------------------------------------------------------------------
  PipelineTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-pipeline-trigger-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: start-this-pipeline-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: StartPipeline
                Effect: Allow
                Action:
                  - "codepipeline:StartPipelineExecution"
                Resource: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  EcrPushRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-ecr-push-trigger"
      Description: Start the delivery pipeline when the deployed tag is pushed.
      State: ENABLED
      EventPattern:
        source:
          - aws.ecr
        detail-type:
          - ECR Image Action
        detail:
          action-type:
            - PUSH
          result:
            - SUCCESS
          repository-name:
            - !Ref EcrRepositoryName
          image-tag:
            - !Ref ImageTag
      Targets:
        - Id: pipeline
          Arn: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
          RoleArn: !GetAtt PipelineTriggerRole.Arn

Outputs:

  PipelineName:
    Description: Delivery pipeline name.
    Value: !Ref Pipeline

  PipelineUrl:
    Description: Console link to watch a deployment.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view?region=${AWS::Region}"

  CodeDeployApplicationName:
    Description: CodeDeploy application name.
    Value: !Ref CodeDeployApplication

  DeploymentGroupName:
    Description: CodeDeploy deployment group name.
    Value: !Ref DeploymentGroup
