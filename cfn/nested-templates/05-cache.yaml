AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Cache tier: an ElastiCache for Redis replication group in the cache subnets,
  encrypted in transit and at rest, with its AUTH token generated by Secrets
  Manager. A replication group rather than a standalone cache cluster because
  AWS::ElastiCache::CacheCluster cannot enable encryption in transit at all.

Parameters:

  ProjectName:
    Type: String
    Description: Name prefix and Project tag value for every resource.

  CacheSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: The two cache-tier private subnets. Nothing else belongs in them.

  CacheSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for the nodes - admits the ECS tasks only.

  RedisPort:
    Type: Number
    Default: 6379
    Description: Redis port.

  EngineVersion:
    Type: String
    Default: "7.1"
    AllowedValues:
      - "7.1"
      - "7.0"
      - "6.2"
    Description: Redis engine version.

  CacheParameterGroupName:
    Type: String
    Default: default.redis7
    Description: >-
      Must match the engine major version - default.redis7 for 7.x. A mismatch
      here fails at create time with a fairly unhelpful message.

Resources:

  # ---------------------------------------------------------------------------
  # The AUTH token is generated inside Secrets Manager and is never a template
  # parameter, so it is never typed, never committed, and never printed by a
  # describe-stacks call. The application reads it the same way it reads the
  # database password: injected by the ECS execution role as a container secret.
  # ---------------------------------------------------------------------------
  AuthTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/redis/auth-token"
      Description: Redis AUTH token for the ElastiCache replication group.
      GenerateSecretString:
        # JSON rather than a bare string, so the task definition can select the
        # value with a ValueFrom key selector exactly like the RDS secret.
        SecretStringTemplate: |
          {
            "username": "default"
          }
        GenerateStringKey: authToken
        PasswordLength: 64
        # Redis rejects an AUTH token containing a space or a double quote, and
        # several punctuation characters are awkward to pass through a shell
        # when debugging. Excluding punctuation entirely leaves 64 alphanumeric
        # characters, which is far past the 16 character minimum.
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      CacheSubnetGroupName: !Sub "${ProjectName}-cache-subnets"
      Description: Cache-tier subnets only - no app or data subnets.
      SubnetIds: !Ref CacheSubnetIds
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: !Sub "${ProjectName}-redis"
      ReplicationGroupDescription: Read-through cache for the To-Do API.
      Engine: redis
      EngineVersion: !Ref EngineVersion
      CacheParameterGroupName: !Ref CacheParameterGroupName
      CacheNodeType: cache.t4g.micro
      NumCacheClusters: 2
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      Port: !Ref RedisPort
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      SecurityGroupIds:
        - !Ref CacheSecurityGroupId
      TransitEncryptionEnabled: true
      AtRestEncryptionEnabled: true
      # Resolved by CloudFormation at deploy time from the secret above. The
      # token never exists in the repository, and referencing the secret here
      # is also what orders this resource after it.
      AuthToken: !Sub "{{resolve:secretsmanager:${AuthTokenSecret}:SecretString:authToken}}"
      AutoMinorVersionUpgrade: true
      # No snapshots: this cache holds nothing that is not re-derivable from
      # PostgreSQL in one query. Production caching something expensive to
      # rebuild would set a retention limit and a snapshot window.
      SnapshotRetentionLimit: 0
      PreferredMaintenanceWindow: "sun:05:00-sun:06:00"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-redis"
        - Key: Project
          Value: !Ref ProjectName

Outputs:

  PrimaryEndpointAddress:
    Description: >-
      Primary endpoint. Writes and reads both go here - with one replica the
      reader endpoint would only add a staleness window for no lab benefit.
    Value: !GetAtt ReplicationGroup.PrimaryEndPoint.Address

  PrimaryEndpointPort:
    Description: Primary endpoint port.
    Value: !GetAtt ReplicationGroup.PrimaryEndPoint.Port

  AuthTokenSecretArn:
    Description: >-
      ARN of the AUTH token secret, passed to the ECS execution role so it can
      inject the token into the container.
    Value: !Ref AuthTokenSecret

  ReplicationGroupId:
    Description: Replication group id.
    Value: !Ref ReplicationGroup
