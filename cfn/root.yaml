AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Root stack for the To-Do lab: network, security groups, VPC endpoints, RDS
  with RDS Proxy, ElastiCache Redis, ALB with ECS Fargate, and the blue/green
  delivery pipeline. Nested stacks are split by lifecycle and wired root to
  nested through Outputs and Parameters - no nested stack imports a sibling.
  Long-lived artifacts come from the bootstrap stack through Fn::ImportValue.

Parameters:

  ProjectName:
    Type: String
    Default: todo-app
    AllowedPattern: "^[a-z][a-z0-9-]{2,30}$"
    Description: Name prefix and Project tag value for every resource in every stack.

  BootstrapStackName:
    Type: String
    Default: todo-app-bootstrap
    Description: >-
      Name of the bootstrap stack whose exports this stack consumes. Nothing is
      copy-pasted between the two.

  # --- Database

  DatabaseEngineVersion:
    Type: String
    Default: "16"
    Description: PostgreSQL major version.

  # --- Ports and access

  ContainerPort:
    Type: Number
    Default: 8080
    Description: Port the container listens on.

  # --- Cache

  CacheTtlSeconds:
    Type: Number
    Default: 60
    Description: TTL on cached reads.

  # --- Compute

  ImageTag:
    Type: String
    Default: latest
    Description: >-
      Tag for the bootstrap task revision and the tag the pipeline watches. An
      image with this tag must exist in ECR before this stack is created.

  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues:
      - "256"
      - "512"
      - "1024"
    Description: Fargate CPU units.

  TaskMemory:
    Type: String
    Default: "1024"
    AllowedValues:
      - "512"
      - "1024"
      - "2048"
    Description: Fargate memory, MiB.

Resources:

  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested-templates/01-network.yaml
      Parameters:
        ProjectName: !Ref ProjectName
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested-templates/02-security.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        VpcCidr: !GetAtt NetworkStack.Outputs.VpcCidr
        ContainerPort: !Ref ContainerPort
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  VpcEndpointsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested-templates/03-vpc-endpoints.yaml
      Parameters:
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        EndpointSubnetIds: !GetAtt NetworkStack.Outputs.EndpointSubnetIds
        PrivateRouteTableIds: !GetAtt NetworkStack.Outputs.PrivateRouteTableIds
        VpcEndpointSecurityGroupId: !GetAtt SecurityStack.Outputs.VpcEndpointSecurityGroupId
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    # Explicit, because nothing in this stack references a VPC endpoint output.
    # The RDS Proxy reads the master secret from Secrets Manager while it is
    # being created, and with no NAT gateway the interface endpoint is its only
    # route there. Without this ordering the proxy comes up
    # incompatible-network roughly half the time, depending on which stack wins
    # the race.
    DependsOn: VpcEndpointsStack
    Properties:
      TemplateURL: nested-templates/04-database.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        DataSubnetIds: !GetAtt NetworkStack.Outputs.DataSubnetIds
        DatabaseSecurityGroupId: !GetAtt SecurityStack.Outputs.DatabaseSecurityGroupId
        RdsProxySecurityGroupId: !GetAtt SecurityStack.Outputs.RdsProxySecurityGroupId
        DatabasePort: 5432
        EngineVersion: !Ref DatabaseEngineVersion
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  CacheStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested-templates/05-cache.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        CacheSubnetIds: !GetAtt NetworkStack.Outputs.CacheSubnetIds
        CacheSecurityGroupId: !GetAtt SecurityStack.Outputs.CacheSecurityGroupId
        RedisPort: 6379
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  AlbEcsStack:
    Type: AWS::CloudFormation::Stack
    # Explicit for the same reason as the database stack: nothing here
    # references a VPC endpoint output, but the first task cannot pull its image
    # from ECR until the ecr.api, ecr.dkr and S3 endpoints exist, and a service
    # whose first task fails to pull blocks the stack until it times out.
    DependsOn: VpcEndpointsStack
    Properties:
      TemplateURL: nested-templates/06-alb-ecs.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnetIds: !GetAtt NetworkStack.Outputs.PublicSubnetIds
        AppSubnetIds: !GetAtt NetworkStack.Outputs.AppSubnetIds
        AlbSecurityGroupId: !GetAtt SecurityStack.Outputs.AlbSecurityGroupId
        EcsTaskSecurityGroupId: !GetAtt SecurityStack.Outputs.EcsTaskSecurityGroupId
        ArtifactBucketName: !ImportValue
          Fn::Sub: "${BootstrapStackName}-ArtifactBucketName"
        EcrRepositoryUri: !ImportValue
          Fn::Sub: "${BootstrapStackName}-EcrRepositoryUri"
        EcrRepositoryArn: !ImportValue
          Fn::Sub: "${BootstrapStackName}-EcrRepositoryArn"
        ImageTag: !Ref ImageTag
        ContainerPort: !Ref ContainerPort
        TaskCpu: !Ref TaskCpu
        TaskMemory: !Ref TaskMemory
        DatabaseProxyEndpoint: !GetAtt DatabaseStack.Outputs.ProxyEndpoint
        DatabasePort: !GetAtt DatabaseStack.Outputs.DatabasePort
        DatabaseName: !GetAtt DatabaseStack.Outputs.DatabaseName
        DatabaseSecretArn: !GetAtt DatabaseStack.Outputs.MasterUserSecretArn
        RedisEndpoint: !GetAtt CacheStack.Outputs.PrimaryEndpointAddress
        RedisPort: !GetAtt CacheStack.Outputs.PrimaryEndpointPort
        RedisAuthSecretArn: !GetAtt CacheStack.Outputs.AuthTokenSecretArn
        CacheTtlSeconds: !Ref CacheTtlSeconds
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  CicdStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested-templates/07-cicd-pipeline.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        ArtifactBucketName: !ImportValue
          Fn::Sub: "${BootstrapStackName}-ArtifactBucketName"
        ArtifactBucketArn: !ImportValue
          Fn::Sub: "${BootstrapStackName}-ArtifactBucketArn"
        EcrRepositoryName: !ImportValue
          Fn::Sub: "${BootstrapStackName}-EcrRepositoryName"
        EcrRepositoryArn: !ImportValue
          Fn::Sub: "${BootstrapStackName}-EcrRepositoryArn"
        ImageTag: !Ref ImageTag
        ClusterName: !GetAtt AlbEcsStack.Outputs.ClusterName
        ServiceName: !GetAtt AlbEcsStack.Outputs.ServiceName
        TargetGroupBlueName: !GetAtt AlbEcsStack.Outputs.TargetGroupBlueName
        TargetGroupGreenName: !GetAtt AlbEcsStack.Outputs.TargetGroupGreenName
        ProdListenerArn: !GetAtt AlbEcsStack.Outputs.ProdListenerArn
        TestListenerArn: !GetAtt AlbEcsStack.Outputs.TestListenerArn
        EcsExecutionRoleArn: !GetAtt AlbEcsStack.Outputs.ExecutionRoleArn
        EcsTaskRoleArn: !GetAtt AlbEcsStack.Outputs.TaskRoleArn
        ContainerPort: !Ref ContainerPort
        TaskCpu: !Ref TaskCpu
        TaskMemory: !Ref TaskMemory
        LogGroupName: !GetAtt AlbEcsStack.Outputs.LogGroupName
        DatabaseProxyEndpoint: !GetAtt DatabaseStack.Outputs.ProxyEndpoint
        DatabasePort: !GetAtt DatabaseStack.Outputs.DatabasePort
        DatabaseName: !GetAtt DatabaseStack.Outputs.DatabaseName
        DatabaseSecretArn: !GetAtt DatabaseStack.Outputs.MasterUserSecretArn
        RedisEndpoint: !GetAtt CacheStack.Outputs.PrimaryEndpointAddress
        RedisPort: !GetAtt CacheStack.Outputs.PrimaryEndpointPort
        RedisAuthSecretArn: !GetAtt CacheStack.Outputs.AuthTokenSecretArn
        CacheTtlSeconds: !Ref CacheTtlSeconds
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:

  ApplicationUrl:
    Description: Public URL of the To-Do application.
    Value: !GetAtt AlbEcsStack.Outputs.ApplicationUrl

  TestListenerUrl:
    Description: Green task set during a deployment, before traffic shifts.
    Value: !GetAtt AlbEcsStack.Outputs.TestListenerUrl

  PipelineUrl:
    Description: Console link to the delivery pipeline.
    Value: !GetAtt CicdStack.Outputs.PipelineUrl

  ClusterName:
    Description: ECS cluster name.
    Value: !GetAtt AlbEcsStack.Outputs.ClusterName

  ServiceName:
    Description: ECS service name.
    Value: !GetAtt AlbEcsStack.Outputs.ServiceName

  ContainerName:
    Description: Container name used in appspec.yaml and taskdef.json.
    Value: !GetAtt AlbEcsStack.Outputs.ContainerName

  TaskFamily:
    Description: Task definition family the pipeline registers revisions in.
    Value: !Sub "${ProjectName}-task"

  ExecutionRoleArn:
    Description: ECS execution role ARN.
    Value: !GetAtt AlbEcsStack.Outputs.ExecutionRoleArn

  TaskRoleArn:
    Description: ECS task role ARN.
    Value: !GetAtt AlbEcsStack.Outputs.TaskRoleArn

  LogGroupName:
    Description: CloudWatch log group for the tasks.
    Value: !GetAtt AlbEcsStack.Outputs.LogGroupName

  DatabaseProxyEndpoint:
    Description: RDS Proxy endpoint the application connects to.
    Value: !GetAtt DatabaseStack.Outputs.ProxyEndpoint

  DatabasePort:
    Description: PostgreSQL port.
    Value: !GetAtt DatabaseStack.Outputs.DatabasePort

  DatabaseName:
    Description: Database name.
    Value: !GetAtt DatabaseStack.Outputs.DatabaseName

  DatabaseSecretArn:
    Description: RDS-managed master secret ARN.
    Value: !GetAtt DatabaseStack.Outputs.MasterUserSecretArn

  RedisEndpoint:
    Description: ElastiCache primary endpoint.
    Value: !GetAtt CacheStack.Outputs.PrimaryEndpointAddress

  RedisPort:
    Description: Redis port.
    Value: !GetAtt CacheStack.Outputs.PrimaryEndpointPort

  RedisAuthSecretArn:
    Description: Redis AUTH token secret ARN.
    Value: !GetAtt CacheStack.Outputs.AuthTokenSecretArn
