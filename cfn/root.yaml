AWSTemplateFormatVersion: "2010-09-09"

# =============================================================================
# Why every nested template has its own hash parameter
#
# The packaging workflow uploads each nested template as
# templates/<name>-<hash>.yaml, where <hash> is the first 12 characters of
# `git hash-object` over that one file, and commits the hashes back into
# cfn/deployment-file.yaml. Git sync then deploys that commit.
#
# CloudFormation decides whether a nested stack needs updating by comparing the
# TemplateURL string. It does not fetch the object and diff it. So a single
# shared version string - a build number, a commit sha, a date - changes every
# URL on every push and drags all seven nested stacks through an update, even
# the six that did not change. On this stack that means the RDS and ElastiCache
# stacks get visited on every unrelated edit, which is slow and occasionally
# destructive.
#
# A per-file content hash means the URL changes for exactly the templates whose
# bytes changed. Editing 06 updates 06 and nothing else.
# =============================================================================

Description: >-
  Root stack for the To-Do lab: network, security groups, VPC endpoints, RDS
  with RDS Proxy, ElastiCache Redis, ALB with ECS Fargate, and the blue/green
  delivery pipeline. Nested stacks are split by lifecycle and wired root to
  nested through Outputs and Parameters - no nested stack imports a sibling.
  Long-lived artifacts come from the bootstrap stack through Fn::ImportValue.

Parameters:

  ProjectName:
    Type: String
    Default: todo-app
    AllowedPattern: "^[a-z][a-z0-9-]{2,30}$"
    Description: Name prefix and Project tag value for every resource in every stack.

  BootstrapStackName:
    Type: String
    Default: todo-app-bootstrap
    Description: >-
      Name of the bootstrap stack whose exports this stack consumes. Nothing is
      copy-pasted between the two.

  # --- Packaged template hashes, written by .github/workflows/package-templates.yml

  NetworkTemplateHash:
    Type: String
    Description: Content hash of 01-network.yaml.

  SecurityTemplateHash:
    Type: String
    Description: Content hash of 02-security.yaml.

  VpcEndpointsTemplateHash:
    Type: String
    Description: Content hash of 03-vpc-endpoints.yaml.

  DatabaseTemplateHash:
    Type: String
    Description: Content hash of 04-database.yaml.

  CacheTemplateHash:
    Type: String
    Description: Content hash of 05-cache.yaml.

  AlbEcsTemplateHash:
    Type: String
    Description: Content hash of 06-alb-ecs.yaml.

  CicdTemplateHash:
    Type: String
    Description: Content hash of 07-cicd-pipeline.yaml.

  # --- Network

  VpcCidr:
    Type: String
    Default: "10.40.0.0/16"
    Description: VPC CIDR.

  PublicSubnet1Cidr:
    Type: String
    Default: "10.40.0.0/24"
    Description: Public subnet, AZ A.

  PublicSubnet2Cidr:
    Type: String
    Default: "10.40.1.0/24"
    Description: Public subnet, AZ B.

  AppSubnet1Cidr:
    Type: String
    Default: "10.40.10.0/24"
    Description: App subnet, AZ A.

  AppSubnet2Cidr:
    Type: String
    Default: "10.40.11.0/24"
    Description: App subnet, AZ B.

  DataSubnet1Cidr:
    Type: String
    Default: "10.40.20.0/24"
    Description: Data subnet, AZ A.

  DataSubnet2Cidr:
    Type: String
    Default: "10.40.21.0/24"
    Description: Data subnet, AZ B.

  CacheSubnet1Cidr:
    Type: String
    Default: "10.40.30.0/24"
    Description: Cache subnet, AZ A.

  CacheSubnet2Cidr:
    Type: String
    Default: "10.40.31.0/24"
    Description: Cache subnet, AZ B.

  # --- Ports and access

  ContainerPort:
    Type: Number
    Default: 8080
    Description: Port the container listens on.

  TestListenerPort:
    Type: Number
    Default: 9000
    Description: ALB test listener port for blue/green validation.

  TestListenerCidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: Who may reach the test listener. Narrow this for anything real.

  S3PrefixListId:
    Type: String
    AllowedPattern: "^pl-[0-9a-f]+$"
    Description: >-
      Managed prefix list for S3 in this region, used by the task egress rule to
      the S3 gateway endpoint. Region-specific; find it with
      ec2 describe-managed-prefix-lists.

  # --- Database

  DatabaseName:
    Type: String
    Default: todoapp
    Description: Initial database name.

  MasterUsername:
    Type: String
    Default: todoadmin
    Description: Master username. The password is generated by RDS, never set here.

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t4g.micro
      - db.t4g.small
    Description: RDS instance class.

  DatabaseEngineVersion:
    Type: String
    Default: "16"
    Description: PostgreSQL major version.

  MultiAZ:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: RDS Multi-AZ. Off for cost; production runs it on.

  BackupRetentionPeriod:
    Type: Number
    Default: 1
    Description: Days of automated RDS backups.

  # --- Cache

  CacheNodeType:
    Type: String
    Default: cache.t4g.micro
    AllowedValues:
      - cache.t4g.micro
      - cache.t4g.small
      - cache.t3.micro
      - cache.t3.small
    Description: ElastiCache node type.

  CacheReplicaCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 2
    Description: >-
      Replicas behind the primary. 1 buys Multi-AZ failover at double the node
      cost; 0 halves the bill and gives it up.

  CacheTtlSeconds:
    Type: Number
    Default: 60
    Description: TTL on cached reads.

  # --- Compute

  ImageTag:
    Type: String
    Default: latest
    Description: >-
      Tag for the bootstrap task revision and the tag the pipeline watches. An
      image with this tag must exist in ECR before this stack is created.

  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues:
      - "256"
      - "512"
      - "1024"
    Description: Fargate CPU units.

  TaskMemory:
    Type: String
    Default: "1024"
    AllowedValues:
      - "512"
      - "1024"
      - "2048"
    Description: Fargate memory, MiB.

  DesiredCount:
    Type: Number
    Default: 1
    Description: Starting task count.

  MinCapacity:
    Type: Number
    Default: 1
    Description: Autoscaling floor.

  MaxCapacity:
    Type: Number
    Default: 4
    Description: Autoscaling ceiling.

  CpuTargetValue:
    Type: Number
    Default: 60
    Description: Target average CPU percentage.

  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 1
      - 3
      - 7
      - 14
      - 30
      - 90
    Description: CloudWatch Logs retention.

  # --- Delivery

  TerminationWaitTimeInMinutes:
    Type: Number
    Default: 10
    Description: How long the blue task set survives after cutover.

  DeploymentConfigName:
    Type: String
    Default: CodeDeployDefault.ECSAllAtOnce
    AllowedValues:
      - CodeDeployDefault.ECSAllAtOnce
      - CodeDeployDefault.ECSLinear10PercentEvery1Minutes
      - CodeDeployDefault.ECSCanary10Percent5Minutes
    Description: CodeDeploy traffic shifting strategy.

Resources:

  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - "https://s3.${AWS::Region}.amazonaws.com/${TemplatesBucket}/templates/01-network-${Hash}.yaml"
        - TemplatesBucket: !ImportValue
            Fn::Sub: "${BootstrapStackName}-TemplatesBucketName"
          Hash: !Ref NetworkTemplateHash
      Parameters:
        ProjectName: !Ref ProjectName
        VpcCidr: !Ref VpcCidr
        PublicSubnet1Cidr: !Ref PublicSubnet1Cidr
        PublicSubnet2Cidr: !Ref PublicSubnet2Cidr
        AppSubnet1Cidr: !Ref AppSubnet1Cidr
        AppSubnet2Cidr: !Ref AppSubnet2Cidr
        DataSubnet1Cidr: !Ref DataSubnet1Cidr
        DataSubnet2Cidr: !Ref DataSubnet2Cidr
        CacheSubnet1Cidr: !Ref CacheSubnet1Cidr
        CacheSubnet2Cidr: !Ref CacheSubnet2Cidr
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - "https://s3.${AWS::Region}.amazonaws.com/${TemplatesBucket}/templates/02-security-${Hash}.yaml"
        - TemplatesBucket: !ImportValue
            Fn::Sub: "${BootstrapStackName}-TemplatesBucketName"
          Hash: !Ref SecurityTemplateHash
      Parameters:
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        ContainerPort: !Ref ContainerPort
        TestListenerPort: !Ref TestListenerPort
        TestListenerCidr: !Ref TestListenerCidr
        S3PrefixListId: !Ref S3PrefixListId
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  VpcEndpointsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - "https://s3.${AWS::Region}.amazonaws.com/${TemplatesBucket}/templates/03-vpc-endpoints-${Hash}.yaml"
        - TemplatesBucket: !ImportValue
            Fn::Sub: "${BootstrapStackName}-TemplatesBucketName"
          Hash: !Ref VpcEndpointsTemplateHash
      Parameters:
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        EndpointSubnetIds: !GetAtt NetworkStack.Outputs.EndpointSubnetIds
        PrivateRouteTableIds: !GetAtt NetworkStack.Outputs.PrivateRouteTableIds
        VpcEndpointSecurityGroupId: !GetAtt SecurityStack.Outputs.VpcEndpointSecurityGroupId
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    # Explicit, because nothing in this stack references a VPC endpoint output.
    # The RDS Proxy reads the master secret from Secrets Manager while it is
    # being created, and with no NAT gateway the interface endpoint is its only
    # route there. Without this ordering the proxy comes up
    # incompatible-network roughly half the time, depending on which stack wins
    # the race.
    DependsOn: VpcEndpointsStack
    Properties:
      TemplateURL: !Sub
        - "https://s3.${AWS::Region}.amazonaws.com/${TemplatesBucket}/templates/04-database-${Hash}.yaml"
        - TemplatesBucket: !ImportValue
            Fn::Sub: "${BootstrapStackName}-TemplatesBucketName"
          Hash: !Ref DatabaseTemplateHash
      Parameters:
        ProjectName: !Ref ProjectName
        DataSubnetIds: !GetAtt NetworkStack.Outputs.DataSubnetIds
        DatabaseSecurityGroupId: !GetAtt SecurityStack.Outputs.DatabaseSecurityGroupId
        RdsProxySecurityGroupId: !GetAtt SecurityStack.Outputs.RdsProxySecurityGroupId
        DatabaseName: !Ref DatabaseName
        MasterUsername: !Ref MasterUsername
        DBInstanceClass: !Ref DBInstanceClass
        EngineVersion: !Ref DatabaseEngineVersion
        MultiAZ: !Ref MultiAZ
        BackupRetentionPeriod: !Ref BackupRetentionPeriod
        DatabasePort: 5432
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  CacheStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - "https://s3.${AWS::Region}.amazonaws.com/${TemplatesBucket}/templates/05-cache-${Hash}.yaml"
        - TemplatesBucket: !ImportValue
            Fn::Sub: "${BootstrapStackName}-TemplatesBucketName"
          Hash: !Ref CacheTemplateHash
      Parameters:
        ProjectName: !Ref ProjectName
        CacheSubnetIds: !GetAtt NetworkStack.Outputs.CacheSubnetIds
        CacheSecurityGroupId: !GetAtt SecurityStack.Outputs.CacheSecurityGroupId
        CacheNodeType: !Ref CacheNodeType
        CacheReplicaCount: !Ref CacheReplicaCount
        RedisPort: 6379
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  AlbEcsStack:
    Type: AWS::CloudFormation::Stack
    # Explicit for the same reason as the database stack: nothing here
    # references a VPC endpoint output, but the first task cannot pull its image
    # from ECR until the ecr.api, ecr.dkr and S3 endpoints exist, and a service
    # whose first task fails to pull blocks the stack until it times out.
    DependsOn: VpcEndpointsStack
    Properties:
      TemplateURL: !Sub
        - "https://s3.${AWS::Region}.amazonaws.com/${TemplatesBucket}/templates/06-alb-ecs-${Hash}.yaml"
        - TemplatesBucket: !ImportValue
            Fn::Sub: "${BootstrapStackName}-TemplatesBucketName"
          Hash: !Ref AlbEcsTemplateHash
      Parameters:
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnetIds: !GetAtt NetworkStack.Outputs.PublicSubnetIds
        AppSubnetIds: !GetAtt NetworkStack.Outputs.AppSubnetIds
        AlbSecurityGroupId: !GetAtt SecurityStack.Outputs.AlbSecurityGroupId
        EcsTaskSecurityGroupId: !GetAtt SecurityStack.Outputs.EcsTaskSecurityGroupId
        ArtifactBucketName: !ImportValue
          Fn::Sub: "${BootstrapStackName}-ArtifactBucketName"
        EcrRepositoryUri: !ImportValue
          Fn::Sub: "${BootstrapStackName}-EcrRepositoryUri"
        EcrRepositoryArn: !ImportValue
          Fn::Sub: "${BootstrapStackName}-EcrRepositoryArn"
        ImageTag: !Ref ImageTag
        ContainerPort: !Ref ContainerPort
        TestListenerPort: !Ref TestListenerPort
        TaskCpu: !Ref TaskCpu
        TaskMemory: !Ref TaskMemory
        DesiredCount: !Ref DesiredCount
        MinCapacity: !Ref MinCapacity
        MaxCapacity: !Ref MaxCapacity
        CpuTargetValue: !Ref CpuTargetValue
        LogRetentionDays: !Ref LogRetentionDays
        DatabaseProxyEndpoint: !GetAtt DatabaseStack.Outputs.ProxyEndpoint
        DatabasePort: !GetAtt DatabaseStack.Outputs.DatabasePort
        DatabaseName: !GetAtt DatabaseStack.Outputs.DatabaseName
        DatabaseSecretArn: !GetAtt DatabaseStack.Outputs.MasterUserSecretArn
        RedisEndpoint: !GetAtt CacheStack.Outputs.PrimaryEndpointAddress
        RedisPort: !GetAtt CacheStack.Outputs.PrimaryEndpointPort
        RedisAuthSecretArn: !GetAtt CacheStack.Outputs.AuthTokenSecretArn
        CacheTtlSeconds: !Ref CacheTtlSeconds
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  CicdStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - "https://s3.${AWS::Region}.amazonaws.com/${TemplatesBucket}/templates/07-cicd-pipeline-${Hash}.yaml"
        - TemplatesBucket: !ImportValue
            Fn::Sub: "${BootstrapStackName}-TemplatesBucketName"
          Hash: !Ref CicdTemplateHash
      Parameters:
        ProjectName: !Ref ProjectName
        ArtifactBucketName: !ImportValue
          Fn::Sub: "${BootstrapStackName}-ArtifactBucketName"
        ArtifactBucketArn: !ImportValue
          Fn::Sub: "${BootstrapStackName}-ArtifactBucketArn"
        EcrRepositoryName: !ImportValue
          Fn::Sub: "${BootstrapStackName}-EcrRepositoryName"
        EcrRepositoryArn: !ImportValue
          Fn::Sub: "${BootstrapStackName}-EcrRepositoryArn"
        ImageTag: !Ref ImageTag
        ClusterName: !GetAtt AlbEcsStack.Outputs.ClusterName
        ServiceName: !GetAtt AlbEcsStack.Outputs.ServiceName
        TargetGroupBlueName: !GetAtt AlbEcsStack.Outputs.TargetGroupBlueName
        TargetGroupGreenName: !GetAtt AlbEcsStack.Outputs.TargetGroupGreenName
        ProdListenerArn: !GetAtt AlbEcsStack.Outputs.ProdListenerArn
        TestListenerArn: !GetAtt AlbEcsStack.Outputs.TestListenerArn
        EcsExecutionRoleArn: !GetAtt AlbEcsStack.Outputs.ExecutionRoleArn
        EcsTaskRoleArn: !GetAtt AlbEcsStack.Outputs.TaskRoleArn
        TerminationWaitTimeInMinutes: !Ref TerminationWaitTimeInMinutes
        DeploymentConfigName: !Ref DeploymentConfigName
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:

  ApplicationUrl:
    Description: Public URL of the To-Do application.
    Value: !GetAtt AlbEcsStack.Outputs.ApplicationUrl

  TestListenerUrl:
    Description: Green task set during a deployment, before traffic shifts.
    Value: !GetAtt AlbEcsStack.Outputs.TestListenerUrl

  PipelineUrl:
    Description: Console link to the delivery pipeline.
    Value: !GetAtt CicdStack.Outputs.PipelineUrl

  # --- Consumed by the application repository build workflow when it renders
  # --- ecs/taskdef.json. Keep the names stable; the workflow greps for them.

  ClusterName:
    Description: ECS cluster name.
    Value: !GetAtt AlbEcsStack.Outputs.ClusterName

  ServiceName:
    Description: ECS service name.
    Value: !GetAtt AlbEcsStack.Outputs.ServiceName

  ContainerName:
    Description: Container name used in appspec.yaml and taskdef.json.
    Value: !GetAtt AlbEcsStack.Outputs.ContainerName

  TaskFamily:
    Description: Task definition family the pipeline registers revisions in.
    Value: !Sub "${ProjectName}-task"

  ExecutionRoleArn:
    Description: ECS execution role ARN.
    Value: !GetAtt AlbEcsStack.Outputs.ExecutionRoleArn

  TaskRoleArn:
    Description: ECS task role ARN.
    Value: !GetAtt AlbEcsStack.Outputs.TaskRoleArn

  LogGroupName:
    Description: CloudWatch log group for the tasks.
    Value: !GetAtt AlbEcsStack.Outputs.LogGroupName

  DatabaseProxyEndpoint:
    Description: RDS Proxy endpoint the application connects to.
    Value: !GetAtt DatabaseStack.Outputs.ProxyEndpoint

  DatabasePort:
    Description: PostgreSQL port.
    Value: !GetAtt DatabaseStack.Outputs.DatabasePort

  DatabaseName:
    Description: Database name.
    Value: !GetAtt DatabaseStack.Outputs.DatabaseName

  DatabaseSecretArn:
    Description: RDS-managed master secret ARN.
    Value: !GetAtt DatabaseStack.Outputs.MasterUserSecretArn

  RedisEndpoint:
    Description: ElastiCache primary endpoint.
    Value: !GetAtt CacheStack.Outputs.PrimaryEndpointAddress

  RedisPort:
    Description: Redis port.
    Value: !GetAtt CacheStack.Outputs.PrimaryEndpointPort

  RedisAuthSecretArn:
    Description: Redis AUTH token secret ARN.
    Value: !GetAtt CacheStack.Outputs.AuthTokenSecretArn
